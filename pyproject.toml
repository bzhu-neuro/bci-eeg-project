[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bci_eeg"
version = "0.1.0"
description = "Motor-imagery EEG decoding, testing whether HH-project synchronization principles show up in real EEG"
requires-python = ">=3.9"
dependencies = [
    "mne>=1.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]